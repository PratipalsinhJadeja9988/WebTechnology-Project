<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin — Reports</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <a class="brand" href="admin-dashboard.html"><span class="logo">HB</span><div><div style="font-weight:700">Hotel Booking — Admin</div><div style="font-size:12px;color:var(--muted-text)">Reports</div></div></a>
      <nav class="topnav">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-bookings.html">Bookings</a>
        <a href="admin-rooms.html">Rooms</a>
        <a href="admin-guests.html">Guests</a>
        <a class="active" href="admin-reports.html">Reports</a>
      </nav>
    </header>

    <main>
      <div class="page-header">
        <h1>Reports & Analytics</h1>
        <div>
          <a class="btn small" href="#">📊 Export Report</a>
        </div>
      </div>

      <div class="card">
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
          <div>
            <label class="label">Date Range</label>
            <select class="input"><option>Last 30 days</option><option>This month</option></select>
          </div>
          <div>
            <label class="label">Report Type</label>
            <select class="input"><option>Overview</option><option>Revenue</option></select>
          </div>
        </div>

        <div class="grid grid-3" style="margin-top:12px">
          <div class="stat card"><div class="label">Total Revenue</div><div class="value">$47,892</div><div class="kicker" style="color:var(--success)">+12.5%</div></div>
          <div class="stat card"><div class="label">Occupancy Rate</div><div class="value">87.3%</div><div class="kicker" style="color:var(--success)">+5.2%</div></div>
          <div class="stat card"><div class="label">Total Bookings</div><div class="value">324</div><div class="kicker" style="color:var(--success)">+8.7%</div></div>
        </div>

        <div style="margin-top:16px" class="card">
          <h4 style="margin-top:0">Revenue Trend (Last 30 Days)</h4>
          <div style="height:220px;border-radius:8px;border:1px dashed rgba(15,23,42,0.04);display:flex;align-items:center;justify-content:center;">
            <img src="images/line-graph_2-w400.jpeg" alt="trend" style="max-width:100%;max-height:100%;object-fit:contain"/>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
