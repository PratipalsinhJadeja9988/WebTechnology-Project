<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Hotel Booking</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const current = location.pathname.split("/").pop();
      document.querySelectorAll(".topnav a").forEach(a => {
        if (a.getAttribute("href") === current) a.classList.add("active");
      });
    });
  </script>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <a class="brand" href="client-home.html">
        <span class="logo">HB</span>
        <div>
          <div style="font-weight:700">Hotel Booking</div>
          <div style="font-size:12px;color:var(--muted-text)">Create Account</div>
        </div>
      </a>
      <nav class="topnav">
        <a href="client-home.html">Home</a>
        <a href="room-selection.html">Rooms</a>
        <a href="booking-form.html">Booking</a>
        <a href="payment.html">Payment</a>
        <a href="confirmation.html">Confirmation</a>
        <a href="signup.html">SignUp</a>
        <a href="login.html">Login</a>
      </nav>
    </header>
    <br>
    <br>
    <main class="center" style="flex-direction:column;text-align:center;">
      <section class="card" style="max-width:400px;width:100%;">
        <h2 style="margin-top:0;">Create an Account</h2>
        <p class="kicker">Sign up to start booking your dream stay</p>
        <form id="signupForm" style="margin-top:16px;" onsubmit="return validateSignupForm()">
          <label class="label">Full Name</label>
          <input type="text" id="fullName" class="input full" placeholder="Pratipalsinh k Jadeja">
          
          <label class="label">Email</label>
          <input type="email" id="email" class="input full" placeholder="example@email.com">
          
          <label class="label">Password</label>
          <input type="password" id="password" class="input full" placeholder="Create a password">
          
          <label class="label">Confirm Password</label>
          <input type="password" id="confirmPassword" class="input full" placeholder="Re-enter password">
          
          <button type="submit" class="btn" style="margin-top:16px;">Sign Up</button>
        </form>
        <p class="kicker" style="margin-top:12px;">Already have an account?
          <a href="login.html" style="color:var(--primary);text-decoration:none;">Login</a>
        </p>
      </section>
    </main>
  </div>

  <script>
    function validateSignupForm() {
      let fullName = document.getElementById("fullName").value.trim();
      let email = document.getElementById("email").value.trim();
      let password = document.getElementById("password").value;
      let confirmPassword = document.getElementById("confirmPassword").value;

      if (fullName === "" || email === "" || password === "" || confirmPassword === "") {
        alert("Please fill out all fields.");
        return false;
      }

    
      if (fullName.length < 3) {
        alert("Full name must be at least 3 characters long!");
        return false;
      }

     
      let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email.match(emailPattern)) {
        alert("Invalid Email Address!");
        return false;
      }

   
      if (password.length < 6) {
        alert("Password must be at least 6 characters long!");
        return false;
      }


      let passwordPattern = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*?&]{6,}$/;

      if (!password.match(passwordPattern)) {
        alert("Password must contain at least one letter and one number!");
        return false;
      }


      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return false;
      }

      alert("Account Created Successfully!");
     
      window.location.href = "login.html";
      return false;
    }
  </script>
</body>
</html>
