<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment</title>
  <link rel="stylesheet" href="css/style.css" />

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const current = location.pathname.split("/").pop();
      document.querySelectorAll(".topnav a").forEach(a => {
        if (a.getAttribute("href") === current) a.classList.add("active");
      });
    });

    function validatePayment() {
      let cardNumber = document.getElementById("cardNumber").value.trim();
      let expiry = document.getElementById("expiry").value.trim();
      let cvv = document.getElementById("cvv").value.trim();

      // Check empty fields
      if (cardNumber === "" || expiry === "" || cvv === "") {
        alert("Please fill out all fields.");
        return false;
      }

      // Card number must be 16 digits
      let cardPattern = /^[0-9]{16}$/;
      if (!cardNumber.match(cardPattern)) {
        alert("Card Number must be 16 digits!");
        return false;
      }

      // Validate expiry format MM/YY
      let expiryPattern = /^(0[1-9]|1[0-2])\/[0-9]{2}$/;
      if (!expiry.match(expiryPattern)) {
        alert("Invalid Expiry format. Use MM/YY.");
        return false;
      }

      // CVV validation
      let cvvPattern = /^[0-9]{3}$/;
      if (!cvv.match(cvvPattern)) {
        alert("CVV must be 3 digits!");
        return false;
      }

      alert("Payment Successful!");
      window.location.href = "confirmation.html";  // redirect after success
      return true;
    }
  </script>
</head>

<body>
  <div class="container">
    <header class="topbar">
      <a class="brand" href="client-home.html">
        <span class="logo">HB</span>
        <div>
          <div style="font-weight:700">Hotel Booking</div>
          <div style="font-size:12px;color:var(--muted-text)">Payment</div>
        </div>
      </a>

      <nav class="topnav">
        <a href="client-home.html">Home</a>
        <a href="room-selection.html">Rooms</a>
        <a href="booking-form.html">Booking</a>
        <a href="payment.html">Payment</a>
        <a href="confirmation.html">Confirmation</a>
        <a href="signup.html">SignUp</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <main>
      <div class="page-header">
        <h1>Payment Details</h1>
        <div class="kicker">Secure online payment</div>
      </div>

      <!-- ✅ FORM ADDED -->
      <form onsubmit="return validatePayment()">
        <section class="card">
          <div class="form-row">
            <div class="full">
              <label class="label">Card Number</label>
              <input class="input full" id="cardNumber" maxlength="16" placeholder="XXXX XXXX XXXX XXXX" />
            </div>
            <div>
              <label class="label">Expiry</label>
              <input class="input full" id="expiry" placeholder="MM/YY" />
            </div>
            <div>
              <label class="label">CVV</label>
              <input class="input full" id="cvv" maxlength="3" placeholder="123" />
            </div>
          </div>

          <div style="margin-top:16px;">
            <button type="submit" class="btn">Pay Now</button>
          </div>
        </section>
      </form>
    </main>
  </div>
</body>
</html>
